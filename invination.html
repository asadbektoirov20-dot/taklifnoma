<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxsus Taklifnoma</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .invitation-card {
            text-align: center;
            max-width: 600px;
            margin: 50px auto;
            transform: scale(0.9);
            animation: popUp 1s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popUp {
            to { transform: scale(1); }
        }
        .invitation-card h1 {
            font-size: 2.5rem;
            color: #ec4899;
            margin: 20px 0;
        }
        .rsvp-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        .btn-rsvp {
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-yes { background: #10b981; color: white; }
        .btn-no { background: #ef4444; color: white; }
        .btn-rsvp:hover { transform: scale(1.05); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="invitation-card glass-panel">
            <i class="fa-solid fa-envelope-open-text icon-3d" style="font-size: 4rem;"></i>
            <p id="templateTitle" style="color: #94a3b8; text-transform: uppercase; letter-spacing: 2px;">Maxsus Tadbir</p>
            <h1 id="displayName">Mehmon</h1>
            <p style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 20px;">
                Sizni hayotimizdagi eng muhim kunlardan birida qadrli mehmonimiz bo'lishga taklif etamiz!
            </p>
            <div id="eventDetails" style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                <!-- JavaScript orqali to'ldiriladi -->
            </div>

            <h3>Tadbirga kelasizmi? (RSVP)</h3>
            <div class="rsvp-buttons">
                <button class="btn-rsvp btn-yes" onclick="sendRSVP('yes')"><i class="fa-solid fa-check"></i> Albatta kelaman</button>
                <button class="btn-rsvp btn-no" onclick="sendRSVP('no')"><i class="fa-solid fa-xmark"></i> Afsuski kelolmayman</button>
            </div>
            <p id="rsvpResponse" style="margin-top: 15px; font-weight: 600; color: #38bdf8;"></p>
        </div>
    </div>

    <script>
        // URL parametrlarini o'qish
        const urlParams = new URLSearchParams(window.location.search);
        const to = urlParams.get('to');
        const template = urlParams.get('template');

        if(to) {
            // "umar-zuhra" ni "Umar & Zuhra" ko'rinishiga qaytarish
            const formattedNames = to.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' & ');
            document.getElementById('displayName').innerText = formattedNames;
        }
        if(template) {
            document.getElementById('templateTitle').innerText = template + " Taklifnomasi";
        }

        // RSVP funksiyasi (Simulyatsiya)
        function sendRSVP(status) {
            const responseText = document.getElementById('rsvpResponse');
            if(status === 'yes') {
                responseText.innerText = "Rahmat! Ishtirokingiz tasdiqlandi 🎉";
                responseText.style.color = "#10b981";
            } else {
                responseText.innerText = "Javobingiz uchun rahmat, afsusdamiz!";
                responseText.style.color = "#ef4444";
            }
        }
    </script>
</body>
</html>
